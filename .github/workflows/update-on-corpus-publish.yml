# .github/workflows/update-on-corpus-publish.yml
#
# Mirrors lex-au-graph's rebuild-on-corpus-publish.yml. lex-au's
# publish-corpus action fires the same "corpus-published" repository_dispatch
# event at both this repo and lex-au-graph after every weekly corpus publish
# with real changes -- each listens independently, no coordination between
# them. CPU-only: ingest-delta touches ~6-7 changed Acts/week, well within a
# standard GitHub-hosted runner (see FUTURE.md "Monthly embedding refresh on
# GitHub Actions"). A forced full re-ingest (embedding-model swap, a chunker
# change touching most Acts) is NOT this workflow's job -- that still needs a
# GPU and runs manually (ingest-shard / RunPod, see README).
name: Update index on corpus publish

on:
  repository_dispatch:
    types: [corpus-published]
  workflow_dispatch: {}

concurrency:
  group: index-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # matches lex-au's own weekly jobs; headroom for a catch-up week after a skipped run
    env:
      HF_HUB_DISABLE_XET: "1"  # classic LFS transport - see FUTURE.md / decisions log on Xet wedging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lex-au-search
        run: pip install -e ".[dev]"

      - name: Restore corpus from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/restore_corpus_from_hf.py --repo cchew/lex-au --local-dir corpus

      - name: Verify corpus size floor
        run: |
          count=$(python -c "import json; print(len(json.load(open('corpus/index.json'))['acts']))")
          echo "Corpus has $count Acts."
          if [ "$count" -lt 2500 ]; then
            echo "::error::Corpus size ($count) is below the safety floor (2500) -- refusing to run ingest-delta against a possibly-partial corpus."
            exit 1
          fi

      - name: Run test suite
        run: pytest -q

      - name: Resolve dense model name
        id: model
        run: echo "name=$(python -c 'from lexausearch.models import DENSE_MODEL; print(DENSE_MODEL)')" >> "$GITHUB_OUTPUT"

      - name: Fetch published index from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m lexausearch.hf_cache fetch-index --dest ./hf-index --expect-model "${{ steps.model.outputs.name }}"
          if [ ! -d ./hf-index/qdrant_storage ]; then
            echo "::error::No published index found at cchew/lex-au-search-index. This workflow only runs ingest-delta against an existing index -- the first production index needs a manual full ingest (see README). Nothing to do here."
            exit 1
          fi

      - name: Fetch embedding cache from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf download cchew/lex-au-search-embed-cache embed_cache.db --repo-type dataset --local-dir .

      - name: Run ingest-delta
        id: delta
        # ingest-delta intentionally exits non-zero on a PARTIAL failure (a
        # zero-chunk Act, a single Act's parse error, a refused orphan-prune)
        # while still leaving every successfully re-indexed Act in place --
        # that resilience is the whole point of its design (see README). The
        # corpus already has 9 documented zero-chunk Acts, so this isn't a
        # hypothetical: under the step's default `set -e`, that non-zero exit
        # would kill the step before `echo "$output"` or the changed-flag
        # logic ever ran, silently discarding real work instead of pushing
        # the partial result. `set +e` + explicit $? capture keeps the step
        # alive long enough to decide what actually happened.
        run: |
          set +e
          output=$(lex-au-search ingest-delta --corpus-dir corpus --storage-dir ./hf-index/qdrant_storage --cache-path ./embed_cache.db)
          rc=$?
          set -e
          echo "$output"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if echo "$output" | grep -q "Nothing to do"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report index counts
        if: steps.delta.outputs.changed == 'true'
        id: counts
        run: python scripts/report_index_counts.py --storage-dir ./hf-index/qdrant_storage >> "$GITHUB_OUTPUT"

      - name: Publish updated index to Hugging Face
        if: steps.delta.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m lexausearch.hf_cache push-index \
            --storage-dir ./hf-index/qdrant_storage \
            --model "${{ steps.model.outputs.name }}" \
            --act-count "${{ steps.counts.outputs.act_count }}" \
            --chunk-count "${{ steps.counts.outputs.chunk_count }}"

      - name: Publish updated embedding cache to Hugging Face
        if: steps.delta.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload cchew/lex-au-search-embed-cache embed_cache.db embed_cache.db --repo-type dataset

      - name: Fail the run if ingest-delta reported a partial failure
        if: always() && steps.delta.outputs.rc != '0'
        run: |
          echo "::error::ingest-delta exited non-zero (see 'Run ingest-delta' step output above) -- one or more Acts were skipped or failed. Any successfully re-indexed Acts were still pushed to HF above; this failure is for visibility, not because nothing happened."
          exit 1
